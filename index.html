<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ed3f2">
  <title>Urban Outlaw | Playground</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: #99d5f3; color: white; }
    #game { position: fixed; inset: 0; overflow: hidden; }
    #viewport { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .ui { position: absolute; z-index: 5; pointer-events: none; }
    .brand { top: max(22px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left)); text-shadow: 0 2px 10px #1c304c44; }
    .eyebrow { display: flex; gap: 9px; align-items: center; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; opacity: .88; }
    .eyebrow::before { content: ""; width: 19px; height: 3px; background: #f9ed9a; border-radius: 2px; }
    h1 { margin: 7px 0 0; font-size: clamp(25px, 4vw, 38px); font-weight: 1000; line-height: .95; letter-spacing: -1.9px; }
    h1 span { color: #ffdf72; }
    .version { top: max(22px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); background: #16355166; border: 1px solid #ffffff66; border-radius: 999px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800; letter-spacing: 1.6px; backdrop-filter: blur(9px); }
    .dot { height: 7px; width: 7px; background: #96ffc2; border-radius: 50%; box-shadow: 0 0 10px #96ffc2; }
    .hint { bottom: max(22px, env(safe-area-inset-bottom)); left: max(24px, env(safe-area-inset-left)); color: #fff; text-shadow: 0 2px 7px #223e5166; }
    .hint strong { font-size: 13px; letter-spacing: .2px; }
    .hint p { margin: 5px 0 0; font-size: 11px; opacity: .85; }
    .help { bottom: max(22px, env(safe-area-inset-bottom)); right: max(22px, env(safe-area-inset-right)); font-size: 10px; opacity: .75; text-shadow: 0 2px 7px #20394b99; }
    #loading { position: absolute; z-index: 9; left: 50%; top: 50%; transform: translate(-50%,-50%); min-width: 200px; text-align: center; padding: 16px 24px; background: #122739bd; border: 1px solid #ffffff44; border-radius: 15px; font-size: 13px; font-weight: 700; backdrop-filter: blur(12px); }
    #loading.hidden { display: none; }
    #touchControls { display: none; }
    #game.touch-disabled #touchControls { display: none !important; }
    #touchToggle { display:none; position:absolute; z-index:8; top:calc(max(22px, env(safe-area-inset-top)) + 45px); right:max(20px, env(safe-area-inset-right)); align-items:center; justify-content:center; border:1px solid #ffffff98; border-radius:10px; background:#17405fb3; color:white; min-height:40px; padding:10px 13px; font:800 11px system-ui,sans-serif; letter-spacing:.7px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); touch-action:manipulation; cursor:pointer; }
    #game.touch-disabled #touchToggle { background:#263a4ed9; }
    #controllerStatus { display:none; position:absolute; z-index:8; right:max(20px, env(safe-area-inset-right)); top:calc(max(22px, env(safe-area-inset-top)) + 94px); border:1px solid #b4ffd099; background:#153e3fb3; color:#e7fff0; border-radius:9px; padding:9px 11px; font:750 10px system-ui,sans-serif; letter-spacing:.45px; pointer-events:none; }
    #controllerStatus.connected { display:block; }
    .stick-wrap { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: max(25px, env(safe-area-inset-left)); width: 136px; height: 136px; display: grid; place-items: center; pointer-events: auto; touch-action: none; }
    #stick { width: 122px; height: 122px; border-radius: 50%; background: #16395630; border: 2px solid #ffffff99; box-shadow: 0 6px 26px #35536f25, inset 0 0 25px #ffffff20; display: grid; place-items: center; touch-action: none; }
    #knob { width: 56px; height: 56px; border-radius: 50%; background: #fff9; border: 2px solid #fff; box-shadow: 0 4px 14px #2f50684d; pointer-events: none; transform: translate(0,0); }
    .actions { position: absolute; bottom: max(44px, env(safe-area-inset-bottom)); right: max(25px, env(safe-area-inset-right)); display: flex; gap: 14px; align-items: end; pointer-events: auto; }
    .action { touch-action: none; user-select: none; color: #fff; font-weight: 900; font-size: 12px; letter-spacing: .5px; background: #23496b6b; border: 2px solid #ffffffbf; border-radius: 50%; box-shadow: 0 5px 20px #34546a44; backdrop-filter: blur(7px); }
    .action:active, .action.pressed { background: #ffffff88; }
    #run { width: 68px; height: 68px; }
    #jump { width: 92px; height: 92px; background: #ffdb72b0; border-color: #fff4cb; color: #263544; }
    #jump:active { background: #ffeb99; }
    @media (pointer: coarse) {
      #touchControls { display: block; }
      #touchToggle { display: flex; }
      .hint { display: none; }
      .help { display: none; }
      .version { padding: 8px 11px; font-size: 9px; }
    }
    @media (max-width: 420px) {
      h1 { font-size: 26px; }
      .brand { top: max(17px, env(safe-area-inset-top)); left: max(17px, env(safe-area-inset-left)); }
      .version { top: max(19px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
      .stick-wrap { width: 120px; height: 120px; }
      #stick { width: 112px; height: 112px; }
      #jump { width: 82px; height: 82px; }
      #run { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="Urban Outlaw 3D game">
    <canvas id="viewport" aria-label="Third-person 3D game view"></canvas>
    <div class="ui brand"><div class="eyebrow">Free roam prototype</div><h1>URBAN <span>OUTLAW</span></h1></div>
    <div class="ui version"><span class="dot"></span> BUILD 0.2</div>
    <button id="touchToggle" type="button" aria-label="Hide touchscreen controls" aria-pressed="false">TOUCH: ON</button>
    <div id="controllerStatus" role="status" aria-live="polite">CONTROLLER CONNECTED</div>
    <div class="ui hint"><strong>WASD / Arrow keys to move · Space to jump</strong><p>Drag: look · Shift: sprint · DualSense: sticks, Cross, R2</p></div>
    <div class="ui help">EMPTY WORLD · YOUR FIRST CHARACTER</div>
    <div id="touchControls">
      <div class="stick-wrap" id="stickZone" aria-label="Movement joystick"><div id="stick"><div id="knob"></div></div></div>
      <div class="actions">
        <button type="button" class="action" id="run" aria-label="Hold to run">RUN</button>
        <button type="button" class="action" id="jump" aria-label="Jump">JUMP</button>
      </div>
    </div>
    <div id="loading" role="status" aria-live="polite">Loading playground...</div>
  </main>
  <script type="module">
    const loading = document.getElementById('loading');
    async function boot() {
      let THREE;
      try {
        THREE = await import('https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js');
      } catch (err) {
        try {
          THREE = await import('https://unpkg.com/three@0.166.1/build/three.module.js');
        } catch (fallbackError) {
          loading.textContent = 'Unable to load 3D graphics. Check your connection and reload.';
          return;
        }
      }

      try {
        const canvas = document.getElementById('viewport');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9ed5f3);
        scene.fog = new THREE.Fog(0x9ed5f3, 100, 280);
        const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 700);

        const ambient = new THREE.HemisphereLight(0xf2fcff, 0x5d7c40, 2.2);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xfff2d9, 2.5);
        sun.position.set(-25, 45, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -22;
        sun.shadow.camera.right = 22;
        sun.shadow.camera.top = 22;
        sun.shadow.camera.bottom = -22;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 130;
        sun.shadow.bias = -0.00025;
        scene.add(sun);
        scene.add(sun.target);

        // Tiny generated flecks: grass-like ground with no props, buildings or clutter.
        const grassCanvas = document.createElement('canvas');
        grassCanvas.width = grassCanvas.height = 128;
        const g = grassCanvas.getContext('2d');
        g.fillStyle = '#73b35c';
        g.fillRect(0, 0, 128, 128);
        let seed = 82347;
        function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        for (let i = 0; i < 780; i++) {
          const x = random() * 128, y = random() * 128;
          g.fillStyle = random() > 0.45 ? '#76b95f' : '#6dad54';
          g.fillRect(x, y, random() * 2 + .3, random() * 3 + .4);
        }
        const grass = new THREE.CanvasTexture(grassCanvas);
        grass.wrapS = grass.wrapT = THREE.RepeatWrapping;
        grass.repeat.set(140, 140);
        grass.colorSpace = THREE.SRGBColorSpace;
        grass.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(1200, 1200),
          new THREE.MeshStandardMaterial({ map: grass, roughness: 1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Stylized anime ninja modeled entirely in Three.js, with no external assets.
        // The silhouette, palette and gear take direction from the two supplied images.
        const player = new THREE.Group();
        scene.add(player);

        const clothBlue = new THREE.MeshStandardMaterial({ color: 0x193a67, roughness: .89, flatShading: true });
        const clothHighlight = new THREE.MeshStandardMaterial({ color: 0x28517c, roughness: .9, flatShading: true });
        const clothDark = new THREE.MeshStandardMaterial({ color: 0x101d35, roughness: .91, flatShading: true });
        const seam = new THREE.MeshStandardMaterial({ color: 0x304c73, roughness: .94 });
        const shorts = new THREE.MeshStandardMaterial({ color: 0xc4c5ba, roughness: .97, flatShading: true });
        const shortsShadow = new THREE.MeshStandardMaterial({ color: 0x999e9b, roughness: .97 });
        const wraps = new THREE.MeshStandardMaterial({ color: 0xc0c4c4, roughness: 1 });
        const wrapShadow = new THREE.MeshStandardMaterial({ color: 0x8c979f, roughness: 1 });
        const skin = new THREE.MeshStandardMaterial({ color: 0xe7c5b4, roughness: .93 });
        const hair = new THREE.MeshStandardMaterial({ color: 0x111829, roughness: .82, flatShading: true });
        const hairLight = new THREE.MeshStandardMaterial({ color: 0x20304a, roughness: .84, flatShading: true });
        const sandals = new THREE.MeshStandardMaterial({ color: 0x142541, roughness: .95 });
        const metal = new THREE.MeshStandardMaterial({ color: 0xabb7c5, metalness: .46, roughness: .43 });
        const rivetMetal = new THREE.MeshStandardMaterial({ color: 0x445266, metalness: .5, roughness: .49 });
        const gear = new THREE.MeshStandardMaterial({ color: 0x8e8478, roughness: .94 });

        function part(parent, geometry, material, x = 0, y = 0, z = 0) {
          const object = new THREE.Mesh(geometry, material);
          object.position.set(x, y, z);
          object.castShadow = true;
          object.receiveShadow = true;
          parent.add(object);
          return object;
        }
        function cube(parent, material, sx, sy, sz, x, y, z) {
          return part(parent, new THREE.BoxGeometry(sx, sy, sz), material, x, y, z);
        }
        function ball(parent, material, rx, ry, rz, x, y, z) {
          const object = part(parent, new THREE.SphereGeometry(1, 16, 12), material, x, y, z);
          object.scale.set(rx, ry, rz);
          return object;
        }
        function cylinder(parent, material, top, bottom, height, x, y, z, segments = 10) {
          return part(parent, new THREE.CylinderGeometry(top, bottom, height, segments), material, x, y, z);
        }
        function strand(parent, material, from, to, width, sides = 5) {
          const a = new THREE.Vector3(...from);
          const b = new THREE.Vector3(...to);
          const direction = b.clone().sub(a);
          const object = part(parent, new THREE.ConeGeometry(width, direction.length(), sides), material,
            (a.x + b.x) * .5, (a.y + b.y) * .5, (a.z + b.z) * .5);
          object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
          return object;
        }

        // Body proportions are slim and slightly angular rather than Roblox cubes.
        const body = cylinder(player, clothBlue, .59, .48, 1.22, 0, 2.64, 0, 9);
        body.scale.z = .73;
        ball(player, clothBlue, .60, .20, .37, 0, 3.12, 0);
        cylinder(player, clothDark, .50, .44, .18, 0, 2.06, 0, 10);
        cube(player, seam, .93, .065, .69, 0, 2.075, 0);
        cube(player, clothHighlight, .075, .81, .018, -.16, 2.69, .423);

        // Raised collar, with the front opening where the chin meets the shirt.
        const collar = part(player,
          new THREE.CylinderGeometry(.46, .55, .60, 22, 1, true, .44, Math.PI * 2 - .88),
          clothBlue, 0, 3.31, 0);
        collar.scale.z = .86;
        const collarInside = part(player,
          new THREE.CylinderGeometry(.438, .524, .56, 22, 1, true, .46, Math.PI * 2 - .92),
          clothDark, 0, 3.315, 0);
        collarInside.scale.z = .84;
        const collarRim = part(player,
          new THREE.TorusGeometry(.46, .019, 5, 25, Math.PI * 2 - .88),
          seam, 0, 3.61, 0);
        collarRim.rotation.x = Math.PI / 2;
        collarRim.rotation.z = -.45;
        collarRim.scale.y = .86;

        // Uchiha-inspired two-color fan crest, printed on the back of the blue shirt.
        function makeCrest() {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 256;
          const c = canvas.getContext('2d');
          c.lineJoin = 'round';
          c.fillStyle = '#f7f2e5';
          c.beginPath();
          c.moveTo(74, 128); c.lineTo(182, 128); c.lineTo(151, 169);
          c.lineTo(145, 213); c.lineTo(111, 213); c.lineTo(105, 169);
          c.closePath(); c.fill();
          c.fillStyle = '#d85d4e';
          c.beginPath(); c.arc(128, 122, 64, Math.PI, 2 * Math.PI);
          c.lineTo(192, 129); c.lineTo(64, 129); c.closePath(); c.fill();
          c.strokeStyle = '#19294b'; c.lineWidth = 6;
          c.beginPath(); c.arc(128, 122, 64, Math.PI, 2 * Math.PI);
          c.lineTo(192, 129); c.lineTo(151, 169); c.lineTo(145, 213);
          c.lineTo(111, 213); c.lineTo(105, 169); c.lineTo(64, 129); c.closePath(); c.stroke();
          c.beginPath(); c.moveTo(66, 130); c.lineTo(190, 130); c.stroke();
          return canvas;
        }
        const crestMap = new THREE.CanvasTexture(makeCrest());
        crestMap.colorSpace = THREE.SRGBColorSpace;
        const crest = part(player, new THREE.PlaneGeometry(.59, .61),
          new THREE.MeshBasicMaterial({ map: crestMap, transparent: true, side: THREE.DoubleSide, depthWrite: false }),
          0, 2.77, -.399);
        crest.rotation.y = Math.PI;

        // Hips and loose light-gray shorts.
        ball(player, shorts, .48, .29, .38, 0, 1.995, 0);
        const leftLeg = new THREE.Group();
        const rightLeg = new THREE.Group();
        leftLeg.position.set(-.265, 1.91, 0);
        rightLeg.position.set(.265, 1.91, 0);
        player.add(leftLeg, rightLeg);

        function makeLeg(group, side) {
          const thigh = cylinder(group, shorts, .33, .335, .69, 0, -.315, 0, 9);
          thigh.scale.z = 1.05;
          cylinder(group, shortsShadow, .316, .322, .045, 0, -.653, 0, 10);
          ball(group, skin, .205, .23, .20, 0, -.80, 0);
          cylinder(group, wraps, .208, .173, .55, 0, -1.13, 0, 10);
          for (let i = 0; i < 5; i++) {
            const stripe = cylinder(group, i % 2 ? wraps : wrapShadow,
              .207 - i * .007, .205 - i * .007, .035,
              0, -.89 - i * .105, 0, 12);
            stripe.rotation.z = (side === 1 ? 1 : -1) * .10;
          }
          cylinder(group, sandals, .205, .22, .30, 0, -1.52, 0, 10);
          const shoe = ball(group, sandals, .258, .16, .39, 0, -1.73, .14);
          shoe.scale.y = .72;
          cube(group, skin, .34, .065, .22, 0, -1.786, .38);
          cube(group, sandals, .38, .065, .12, 0, -1.76, .26);
          if (side === 1) {
            // Side leg pouch with crossed straps.
            const pouch = cube(group, gear, .18, .37, .24, .34, -.38, 0);
            pouch.rotation.z = -.08;
            const strap = cube(group, wraps, .12, .39, .43, .30, -.34, 0);
            strap.rotation.z = .45;
            cube(group, wrapShadow, .19, .055, .27, .35, -.29, 0);
          }
        }
        makeLeg(leftLeg, -1);
        makeLeg(rightLeg, 1);

        // Articulated arms with blue sleeves, pale hands and cloth forearm wraps.
        const leftArm = new THREE.Group();
        const rightArm = new THREE.Group();
        leftArm.position.set(-.62, 3.03, 0);
        rightArm.position.set(.62, 3.03, 0);
        player.add(leftArm, rightArm);
        function makeArm(group, side) {
          const sleeve = cylinder(group, clothBlue, .25, .23, .52, side * .09, -.26, 0, 9);
          sleeve.rotation.z = -side * .14;
          cylinder(group, seam, .23, .225, .07, side * .14, -.505, 0, 9);
          ball(group, skin, .196, .24, .19, side * .14, -.67, 0);
          cylinder(group, wraps, .193, .17, .48, side * .15, -.91, 0, 10);
          for (let i = 0; i < 4; i++) {
            const stripe = cylinder(group, wrapShadow, .195 - i * .006, .19 - i * .006, .021,
              side * .15, -.725 - i * .115, 0, 12);
            stripe.rotation.z = side * .12;
          }
          ball(group, skin, .185, .19, .14, side * .15, -1.25, .01);
          for (let i = 0; i < 4; i++) {
            cube(group, skin, .07, .14, .11, side * .15 + (i - 1.5) * .068, -1.40, .01);
          }
        }
        makeArm(leftArm, -1);
        makeArm(rightArm, 1);
        leftArm.rotation.z = -.10;
        rightArm.rotation.z = .10;

        // Head, narrow jaw, serious eyes and small anime-style features.
        ball(player, skin, .407, .48, .377, 0, 3.86, .012);
        const jaw = ball(player, skin, .32, .25, .29, 0, 3.59, .07);
        jaw.scale.y = .90;
        ball(player, skin, .086, .16, .083, -.406, 3.82, 0);
        ball(player, skin, .086, .16, .083, .406, 3.82, 0);

        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = faceCanvas.height = 512;
        const f = faceCanvas.getContext('2d');
        f.lineCap = 'round'; f.lineJoin = 'round';
        function ink(points, stroke, width) {
          f.beginPath();
          f.moveTo(points[0][0], points[0][1]);
          for (let i = 1; i < points.length; i++) f.lineTo(points[i][0], points[i][1]);
          f.strokeStyle = stroke; f.lineWidth = width; f.stroke();
        }
        // Asymmetric eyebrows and thin, sharp upper eyelids.
        ink([[82,152],[158,165],[197,174]], '#24242f', 15);
        ink([[315,174],[354,162],[431,149]], '#24242f', 15);
        f.fillStyle = '#f5eee8';
        for (const x of [158, 351]) {
          f.beginPath(); f.ellipse(x, 212, 55, 20, 0, 0, Math.PI * 2); f.fill();
          f.fillStyle = '#353c46'; f.beginPath(); f.ellipse(x, 212, 16, 21, 0, 0, Math.PI * 2); f.fill();
          f.fillStyle = '#151b28'; f.beginPath(); f.ellipse(x, 213, 9, 15, 0, 0, Math.PI * 2); f.fill();
          f.fillStyle = '#f5eee8';
        }
        ink([[103,207],[151,190],[207,209]], '#191d2b', 12);
        ink([[301,207],[355,189],[411,206]], '#191d2b', 12);
        ink([[130,236],[182,239]], '#ae8f86', 3);
        ink([[329,239],[385,236]], '#ae8f86', 3);
        ink([[257,248],[250,308],[269,315]], '#ae8d84', 4);
        ink([[226,377],[255,384],[284,376]], '#775f62', 5);
        const faceMap = new THREE.CanvasTexture(faceCanvas);
        const face = part(player, new THREE.PlaneGeometry(.70, .67),
          new THREE.MeshBasicMaterial({ map: faceMap, transparent: true, depthWrite: false }),
          0, 3.79, .398);

        // Konoha-style forehead protector: dark cloth, silver plate and stylized leaf spiral.
        const band = cylinder(player, clothDark, .421, .426, .184, 0, 4.13, 0, 22);
        band.scale.z = 1.05;
        cube(player, metal, .56, .185, .078, 0, 4.14, .426);
        for (const x of [-.237,.237]) {
          ball(player, rivetMetal, .019, .019, .011, x, 4.14, .474);
        }
        const insigniaCanvas = document.createElement('canvas');
        insigniaCanvas.width = 256; insigniaCanvas.height = 96;
        const k = insigniaCanvas.getContext('2d');
        k.strokeStyle = '#354154'; k.lineWidth = 9; k.lineCap = 'round'; k.lineJoin = 'round';
        k.beginPath();
        k.moveTo(79, 65); k.bezierCurveTo(96, 21, 155, 20, 163, 52);
        k.bezierCurveTo(164, 73, 135, 79, 129, 55);
        k.bezierCurveTo(128, 41, 151, 42, 151, 50);
        k.stroke();
        k.beginPath(); k.moveTo(165, 51); k.lineTo(193, 35); k.moveTo(164, 51); k.lineTo(194, 61); k.stroke();
        k.beginPath(); k.moveTo(99, 67); k.lineTo(86, 83); k.stroke();
        const insignia = part(player, new THREE.PlaneGeometry(.43, .15),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(insigniaCanvas), transparent: true, depthWrite: false }),
          0, 4.143, .472);

        // Layered black/navy hair: a dark cap, back spikes, tall crown and long bangs.
        ball(player, hair, .447, .255, .419, 0, 4.286, -.016);
        // Back-facing spike silhouette, visible during third-person play.
        const backSpikes = [
          [[-.30,4.39,-.24],[-.90,4.66,-.72],.22],
          [[-.18,4.45,-.28],[-.57,4.84,-.89],.23],
          [[0,4.50,-.28],[-.12,4.91,-1.04],.27],
          [[.16,4.45,-.25],[.42,4.85,-.90],.24],
          [[.29,4.37,-.24],[.90,4.63,-.64],.22],
          [[.32,4.28,-.27],[.84,4.28,-.78],.20],
          [[-.34,4.27,-.25],[-.84,4.34,-.75],.21],
          [[0,4.28,-.35],[.12,4.44,-.89],.25]
        ];
        for (const [a,b,r] of backSpikes) strand(player, hair, a, b, r, 5);
        const topSpikes = [
          [[-.30,4.37,0],[-.58,4.88,-.16],.19],
          [[-.13,4.44,0],[-.30,5.04,-.20],.20],
          [[.05,4.46,0],[.04,5.09,-.12],.22],
          [[.24,4.39,0],[.38,5.00,-.18],.20],
          [[.36,4.30,.02],[.68,4.84,-.18],.17],
          [[-.37,4.28,.04],[-.70,4.70,-.21],.17]
        ];
        for (const [a,b,r] of topSpikes) strand(player, hairLight, a, b, r, 5);
        strand(player, hair, [-.34,4.30,.25], [-.42,3.57,.41], .185);
        strand(player, hair, [.33,4.30,.20], [.45,3.64,.38], .18);
        strand(player, hair, [-.14,4.31,.35], [-.20,3.77,.45], .19);
        strand(player, hair, [.17,4.31,.35], [.27,3.93,.47], .15);
        strand(player, hair, [-.27,4.36,.22], [-.12,4.01,.49], .14);
        for (const side of [-1,1]) {
          strand(player, hair, [side*.40,4.26,0], [side*.53,3.58,-.21], .18);
          strand(player, hairLight, [side*.42,4.28,-.10], [side*.57,3.77,-.39], .11);
        }

        const shadow = new THREE.Mesh(
          new THREE.CircleGeometry(1.05, 40),
          new THREE.MeshBasicMaterial({ color: 0x345e2f, transparent: true, opacity: .2, depthWrite: false })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = .025;
        scene.add(shadow);

        const pressed = new Set();
        const handled = new Set(['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'shift']);
        window.addEventListener('keydown', event => {
          const key = event.key.toLowerCase();
          if (handled.has(key)) event.preventDefault();
          pressed.add(key);
          if (key === ' ') jumpRequested = true;
        });
        window.addEventListener('keyup', event => pressed.delete(event.key.toLowerCase()));
        window.addEventListener('blur', () => { pressed.clear(); touchRun = false; stickX = stickY = 0; updateKnob(); });

        let stickX = 0, stickY = 0;
        let stickPointer = null;
        const stickZone = document.getElementById('stickZone');
        const knob = document.getElementById('knob');
        function updateKnob() { knob.style.transform = 'translate(' + (stickX * 38) + 'px, ' + (-stickY * 38) + 'px)'; }
        function updateStick(event) {
          const box = stickZone.getBoundingClientRect();
          const dx = event.clientX - (box.left + box.width / 2);
          const dy = event.clientY - (box.top + box.height / 2);
          const d = Math.max(1, Math.hypot(dx, dy));
          const size = Math.min(d, 44);
          stickX = dx / d * size / 44;
          stickY = -dy / d * size / 44;
          updateKnob();
        }
        stickZone.addEventListener('pointerdown', event => {
          if (stickPointer !== null) return;
          event.preventDefault();
          stickPointer = event.pointerId;
          stickZone.setPointerCapture(event.pointerId);
          updateStick(event);
        });
        stickZone.addEventListener('pointermove', event => { if (event.pointerId === stickPointer) updateStick(event); });
        function releaseStick(event) {
          if (event.pointerId !== stickPointer) return;
          stickPointer = null; stickX = stickY = 0; updateKnob();
        }
        stickZone.addEventListener('pointerup', releaseStick);
        stickZone.addEventListener('pointercancel', releaseStick);
        stickZone.addEventListener('lostpointercapture', () => { stickPointer = null; stickX = stickY = 0; updateKnob(); });

        let jumpRequested = false, touchRun = false, previousPadJump = false;
        document.getElementById('jump').addEventListener('pointerdown', event => { event.preventDefault(); jumpRequested = true; });
        const runButton = document.getElementById('run');
        runButton.addEventListener('pointerdown', event => {
          event.preventDefault();
          touchRun = true;
          runButton.classList.add('pressed');
          runButton.setPointerCapture(event.pointerId);
        });
        function stopRun() { touchRun = false; runButton.classList.remove('pressed'); }
        runButton.addEventListener('pointerup', stopRun);
        runButton.addEventListener('pointercancel', stopRun);
        runButton.addEventListener('lostpointercapture', stopRun);

        const gameRoot = document.getElementById('game');
        const touchToggle = document.getElementById('touchToggle');
        let touchEnabled = true;
        try { touchEnabled = localStorage.getItem('urban-outlaw-touch') !== 'off'; } catch {}
        function setTouchControls(enabled) {
          touchEnabled = enabled;
          gameRoot.classList.toggle('touch-disabled', !enabled);
          touchToggle.textContent = enabled ? 'TOUCH: ON' : 'TOUCH: OFF';
          touchToggle.setAttribute('aria-pressed', String(!enabled));
          touchToggle.setAttribute('aria-label', enabled ? 'Hide touchscreen controls' : 'Show touchscreen controls');
          if (!enabled) { stickPointer = null; stickX = stickY = 0; updateKnob(); stopRun(); }
          try { localStorage.setItem('urban-outlaw-touch', enabled ? 'on' : 'off'); } catch {}
        }
        touchToggle.addEventListener('click', () => setTouchControls(!touchEnabled));
        setTouchControls(touchEnabled);

        let orbit = Math.PI, elevation = .34, distance = 15;
        let dragging = null, lastX = 0, lastY = 0;
        canvas.addEventListener('pointerdown', event => {
          if (event.pointerType === 'touch' && !touchEnabled) return;
          if (dragging !== null) return;
          dragging = event.pointerId;
          lastX = event.clientX; lastY = event.clientY;
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener('pointermove', event => {
          if (event.pointerType === 'touch' && !touchEnabled) return;
          if (event.pointerId !== dragging) return;
          const dx = event.clientX - lastX, dy = event.clientY - lastY;
          orbit -= dx * .006;
          elevation = THREE.MathUtils.clamp(elevation + dy * .004, .15, 1.05);
          lastX = event.clientX; lastY = event.clientY;
        });
        function stopDrag(event) { if (dragging === event.pointerId) dragging = null; }
        canvas.addEventListener('pointerup', stopDrag);
        canvas.addEventListener('pointercancel', stopDrag);
        canvas.addEventListener('lostpointercapture', () => dragging = null);
        canvas.addEventListener('wheel', event => {
          event.preventDefault();
          distance = THREE.MathUtils.clamp(distance + event.deltaY * .008, 6, 25);
        }, { passive: false });
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const last = new THREE.Clock();
        const forward = new THREE.Vector3(), right = new THREE.Vector3();
        const desiredCamera = new THREE.Vector3(), look = new THREE.Vector3();
        let height = 0, verticalSpeed = 0, stride = 0, facing = 0;
        // Standard DualSense mapping supported by Safari's Gamepad API.
        const deadzone = value => !Number.isFinite(value) || Math.abs(value) < .16 ? 0 :
          Math.sign(value) * Math.min(1, (Math.abs(value) - .16) / .84);
        const axis = (pad, i) => pad && pad.axes && Number.isFinite(pad.axes[i]) ? pad.axes[i] : 0;
        const down = (pad, i) => !!(pad && pad.buttons && pad.buttons[i] &&
          (pad.buttons[i].pressed || pad.buttons[i].value > .55));
        const controllerStatus = document.getElementById('controllerStatus');
        let currentPadId = null;
        function refreshPadStatus(pad) {
          const id = pad ? pad.index + ':' + pad.id : null;
          if (id === currentPadId) return;
          currentPadId = id;
          controllerStatus.classList.toggle('connected', !!pad);
          if (pad) {
            controllerStatus.textContent = /dualsense|dualshock|wireless controller|playstation|sony|054c/i.test(pad.id)
              ? 'PLAYSTATION CONTROLLER CONNECTED' : 'CONTROLLER CONNECTED';
          }
        }
        window.addEventListener('gamepaddisconnected', () => {
          currentPadId = null; controllerStatus.classList.remove('connected'); previousPadJump = false;
        });

        function frame() {
          const dt = Math.min(last.getDelta(), .05);
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          const pad = Array.from(pads || []).find(p => p && p.connected) || null;
          refreshPadStatus(pad);
          // Left stick: move. Right stick: orbit camera. D-pad: alternate movement.
          const padX = deadzone(axis(pad, 0)) + (down(pad, 15) ? 1 : 0) - (down(pad, 14) ? 1 : 0);
          const padY = -deadzone(axis(pad, 1)) + (down(pad, 12) ? 1 : 0) - (down(pad, 13) ? 1 : 0);
          orbit -= deadzone(axis(pad, 2)) * 2.5 * dt;
          elevation = THREE.MathUtils.clamp(elevation + deadzone(axis(pad, 3)) * 1.5 * dt, .15, 1.05);
          // Cross: jump on press, not while held.
          const padJump = down(pad, 0);
          if (padJump && !previousPadJump) jumpRequested = true;
          previousPadJump = padJump;

          let x = (pressed.has('d') || pressed.has('arrowright') ? 1 : 0) - (pressed.has('a') || pressed.has('arrowleft') ? 1 : 0) + stickX + padX;
          let y = (pressed.has('w') || pressed.has('arrowup') ? 1 : 0) - (pressed.has('s') || pressed.has('arrowdown') ? 1 : 0) + stickY + padY;
          const inputLength = Math.hypot(x, y);
          if (inputLength > 1) { x /= inputLength; y /= inputLength; }

          forward.set(-Math.sin(orbit), 0, -Math.cos(orbit));
          right.set(forward.z, 0, -forward.x);
          const moveX = forward.x * y + right.x * x;
          const moveZ = forward.z * y + right.z * x;
          const moving = Math.hypot(moveX, moveZ) > .07;
          const sprinting = pressed.has('shift') || touchRun || down(pad, 7) || down(pad, 5) || down(pad, 10);
          const speed = sprinting ? 9.5 : 6.1;
          player.position.x += moveX * speed * dt;
          player.position.z += moveZ * speed * dt;

          if (moving) {
            const angle = Math.atan2(moveX, moveZ);
            facing += Math.atan2(Math.sin(angle - facing), Math.cos(angle - facing)) * Math.min(1, dt * 13);
            stride += dt * (sprinting ? 14 : 10.5) * Math.min(1, inputLength);
          }
          player.rotation.y = facing;
          const swing = moving ? Math.sin(stride) * .65 * Math.min(1, inputLength) : 0;
          leftArm.rotation.x = swing;
          rightArm.rotation.x = -swing;
          leftLeg.rotation.x = -swing;
          rightLeg.rotation.x = swing;

          if (jumpRequested && height <= .001) { verticalSpeed = 8.1; height = .002; }
          jumpRequested = false;
          if (height > 0 || verticalSpeed > 0) {
            verticalSpeed -= 23 * dt;
            height += verticalSpeed * dt;
            if (height < 0) { height = 0; verticalSpeed = 0; }
          }
          player.position.y = height + (height === 0 && moving ? Math.abs(Math.sin(stride)) * .035 : 0);
          shadow.position.x = player.position.x;
          shadow.position.z = player.position.z;
          shadow.scale.setScalar(1 + height * .09);
          shadow.material.opacity = Math.max(.06, .2 - height * .035);

          // Move the light's shadow region with the player in the open world.
          sun.position.set(player.position.x - 25, 45, player.position.z + 30);
          sun.target.position.set(player.position.x, 0, player.position.z);
          sun.target.updateMatrixWorld();

          look.set(player.position.x, player.position.y + 1.85, player.position.z);
          const horizontal = Math.cos(elevation) * distance;
          desiredCamera.set(
            look.x + Math.sin(orbit) * horizontal,
            look.y + Math.sin(elevation) * distance,
            look.z + Math.cos(orbit) * horizontal
          );
          camera.position.lerp(desiredCamera, 1 - Math.exp(-10 * dt));
          camera.lookAt(look);
          renderer.render(scene, camera);
          requestAnimationFrame(frame);
        }

        const startHorizontal = Math.cos(elevation) * distance;
        camera.position.set(Math.sin(orbit) * startHorizontal, 1.85 + Math.sin(elevation) * distance, Math.cos(orbit) * startHorizontal);
        camera.lookAt(0, 1.85, 0);
        loading.classList.add('hidden');
        frame();
      } catch (err) {
        console.error('Urban Outlaw failed to start:', err);
        loading.textContent = '3D could not start on this device. Try refreshing the page.';
      }
    }
    boot();
  </script>
</body>
</html>
