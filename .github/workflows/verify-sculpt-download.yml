name: Verify External Reconstructed GLB Download

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-sculpt-download.yml'

permissions:
  contents: read

jobs:
  download-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download first reconstruction for inspection only
        run: |
          python3 - <<'PY'
          import urllib.request, struct
          url='https://api.thrixel.com/api/v1/6071cd8a-fe6e-4f70-ae10-fc051c7f14ad/download?format=glb&textures=webp&draco=false&quality=full'
          try:
              with urllib.request.urlopen(url,timeout=60) as res:
                  data=res.read()
              magic,ver,size=struct.unpack_from('<4sII',data)
              assert magic==b'glTF' and ver==2 and size==len(data),(magic,ver,size,len(data))
              print('Verified external GLB',len(data),'bytes')
          except Exception as e:
              print('DOWNLOAD ERROR',type(e).__name__,str(e))
              raise
          PY
