name: Refine Urban Outlaw Character Mesh

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/upgrade_character.py"

permissions:
  contents: write

concurrency:
  group: ninja-model-refine
  cancel-in-progress: false

jobs:
  rebuild-character:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch current game assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install free mesh-processing dependencies
        run: |
          python3 -m pip install --disable-pip-version-check "numpy<3" "scipy<2" "trimesh>=4,<5" "Pillow>=10,<13"
      - name: Rebuild the game GLB
        run: |
          # Always rebuild from the verified original v5 commit, never compound edits.
          git show 888fba02f2e83ef8f261721e996b47773aa94497:assets/ninja-character.glb > /tmp/ninja-character-base-v5.glb
          python3 scripts/upgrade_character.py /tmp/ninja-character-base-v5.glb assets/ninja-character.refined.glb
          python3 - <<'PY'
          import trimesh, os
          a=trimesh.load("assets/ninja-character.refined.glb",force="scene")
          assert len(a.geometry)>=38 and len(a.geometry)<=60
          assert sum(len(g.faces) for g in a.geometry.values())>=120000
          assert os.path.getsize("assets/ninja-character.refined.glb")>1000000
          print("Validated",len(a.geometry),"renderable mesh groups")
          PY
          mv assets/ninja-character.refined.glb assets/ninja-character.glb
      - name: Commit refined asset to the playable game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ninja-character.glb
          git diff --cached --quiet && exit 0
          git commit -m "Replace playable ninja GLB with improved garment and hair geometry"
          git push origin HEAD:main
