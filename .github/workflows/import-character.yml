name: Import approved 3D character asset
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-character.yml"

permissions:
  contents: write

jobs:
  import-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified GLB archive
        env:
          ASSET_URL: "https://at.adobe.com/KoY0E5GQ6zKUhIgk"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --location --fail --silent --show-error --retry 3 --max-time 60 "$ASSET_URL" -o /tmp/ninja-character.zip
          echo "84992797e3c38430f7967f64b5c0f18c8c7ea269d10f54bd4150e2b3604c5635  /tmp/ninja-character.zip" | sha256sum --check
          unzip -p /tmp/ninja-character.zip ninja-character.glb > assets/ninja-character.glb
          echo "7b6936315183941d6fce6538c964501d0888445d906c6ad16daf3cd6dea07e99  assets/ninja-character.glb" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          model=Path("assets/ninja-character.glb").read_bytes()
          assert model[:4] == b"glTF" and len(model) > 500_000
          print("Validated GLB:", len(model), "bytes")
          PY
      - name: Commit actual 3D asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ninja-character.glb
          if ! git diff --staged --quiet; then
            git commit -m "Add approved sculpted 3D ninja character model"
            git push
          fi
