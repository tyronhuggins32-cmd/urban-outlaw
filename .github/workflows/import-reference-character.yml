name: Import Reference-Rigged Character
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-reference-character.yml'

permissions:
  contents: write

concurrency:
  group: urban-reference-rig
  cancel-in-progress: false

jobs:
  import-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified 3D character asset
        run: |
          python3 - <<'PY'
          import json, struct, urllib.request, pathlib
          url='https://api.thrixel.com/api/v1/47b9135e-0d57-417c-9a1f-2fb365cdb2b3/download?format=glb&textures=webp&draco=false&quality=full'
          with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Urban-Outlaw-AssetImport/1'}), timeout=200) as resp:
              data=resp.read(25000000)
          magic,ver,total=struct.unpack_from('<4sII',data)
          assert magic==b'glTF' and ver==2 and total==len(data),(magic,ver,total,len(data))
          length,typ=struct.unpack_from('<I4s',data,12)
          assert typ==b'JSON'
          doc=json.loads(data[20:20+length])
          assert len(doc.get('skins',[]))>=1, 'Missing deformable skin weights'
          names=[n.get('name','') for n in doc['nodes']]
          assert any('Head' in s for s in names) and any('Hips' in s for s in names), names
          meshes=doc.get('meshes',[])
          faces=sum(sum(doc['accessors'][p['indices']]['count']//3 for p in m.get('primitives',[]) if 'indices' in p) for m in meshes)
          assert 35000<=faces<=150000,faces
          assert len(data)<18000000,len(data)
          out=pathlib.Path('assets/reference-rig.glb');out.parent.mkdir(exist_ok=True)
          out.write_bytes(data)
          print('Verified reference model',len(data),'bytes',faces,'triangles',len(doc['skins']),'skins',len(names),'nodes')
          PY
      - name: Commit actual GLB for Three.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reference-rig.glb
          git diff --cached --quiet && exit 0
          git commit -m "Add reference-sculpted deformable ninja character GLB"
          git pull --rebase origin main
          git push origin HEAD:main
