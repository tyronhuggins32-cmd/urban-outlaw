name: Import user supplied v5 sculpted ninja
on:
  push:
    paths:
      - ".github/workflows/import-sculpted-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate user's supplied asset package
        env:
          ASSET_URL: "https://at.adobe.com/JxHuMzeMMK2KHbc5"
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --retry 3 --max-time 120 "$ASSET_URL" -o /tmp/ninja-v5-package.zip
          echo "14730023103c5b2a5b16c9410ff59f2104cb01601e94a475ab9377a6d27eb7fb  /tmp/ninja-v5-package.zip" | sha256sum --check
          mkdir -p assets
          unzip -p /tmp/ninja-v5-package.zip ninja_character_sculpted_v5.glb > assets/ninja-character.glb
          echo "fcaf066d95257f6c4d3a9f6d9721408840406887c7016d7a46260f6bd1ec7857  assets/ninja-character.glb" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data=Path("assets/ninja-character.glb").read_bytes()
          assert data[:4] == b"glTF"
          assert struct.unpack_from("<I",data,8)[0] == len(data)
          print("Validated sculpted ninja GLB with",len(data),"bytes")
          PY
      - name: Commit replacement 3D model
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ninja-character.glb
          if ! git diff --cached --quiet; then
            git commit -m "Replace ninja model with user supplied detailed sculpted v5 GLB"
            git push
          fi
