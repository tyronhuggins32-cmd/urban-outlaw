name: V5 Outfit Art Approval (No Deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - art/v5-garment-sculpt-gated
    paths:
      - 'art/v5/**'
      - 'tools/blender/rig_v5_garments.py'
      - 'scripts/import-sculpted-v5-outfit.js'
      - 'tests/v5-approval-gate.cjs'
      - 'tests/v5-shirt-approval-gate.cjs'
      - '.github/workflows/v5-art-approval.yml'
permissions:
  contents: read
jobs:
  approve-source-art:
    name: Block unapproved sculpt from release
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blender source syntax
        run: python3 -m py_compile tools/blender/rig_v5_garments.py
      - name: Validate the full twenty-item shirt audit is complete
        run: node tests/v5-shirt-approval-gate.cjs --audit
      - name: Block release while close-up shirt visual criteria still fail
        run: node tests/v5-shirt-approval-gate.cjs --require-pass
      - name: Block full outfit release until all model approval views pass
        if: always()
        run: node tests/v5-approval-gate.cjs
