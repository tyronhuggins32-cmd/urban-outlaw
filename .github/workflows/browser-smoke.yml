name: Verify Urban Outlaw 3D Character
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'index.html'
      - 'assets/ninja-character.glb'
      - 'assets/blank-body.glb'
      - 'assets/reference-rig.glb'
      - 'assets/reference-rig-separated.glb'
      - 'assets/reference-rig-fluid.glb'
      - 'scripts/reference-character-animations-v2.js'
      - 'scripts/ninja-run.js'
      - 'tests/ninja-run.cjs'
      - 'tests/ninja-run-rig.cjs'
      - 'scripts/recorded-walk.js'
      - 'scripts/retarget-walking.cjs'
      - 'assets/animations/**'
      - 'tests/walk-gait.cjs'
      - 'tests/walk-rig.cjs'
      - 'scripts/walk-cycle-v3.js'
      - 'tests/walk-gait.cjs'
      - 'scripts/character-head-overhaul.js'
      - 'scripts/install-detachable-hair.js'
      - 'assets/approved-detachable-hair.glb'
      - 'assets/sculpted-hair-shell-v4.glb'
      - 'assets/sculpted-hair-v5.glb'
      - 'assets/hair-volume-v6.glb'
      - 'assets/reference-sculpt-hair-v8.glb'
      - 'assets/reference-sculpt-hair-v9.glb'
      - 'assets/reference-sculpt-hair-v10.glb'
      - 'assets/legacy-hair-cleanup.json'
      - 'scripts/extract-reference-hair.py'
      - 'tests/head-fit.cjs'
      - 'scripts/build-hair-volume-v6.py'
      - 'scripts/build-sculpted-hair-v5.py'
      - 'scripts/clean-head-v5.js'
      - 'scripts/hide-legacy-hair-shader.js'
      - 'scripts/build-sculpted-hair-shell-v4.py'
      - 'scripts/diagnose-hand-leg-bridges.py'
      - 'assets/reference/**'
      - 'tests/model-review.cjs'
      - 'tests/head-review.cjs'
      - 'tests/browser-smoke.cjs'
      - 'tests/rig-diagnostics.cjs'
      - 'scripts/reference-character-animations.js'
      - 'scripts/cloth-seam-patches.js'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0 three@0.166.1
      - run: npx playwright install chromium
      - name: Verify walking gait and ninja-run sprint
        run: |
          node tests/ninja-run.cjs
          node tests/ninja-run-rig.cjs
          node tests/walk-gait.cjs
          node tests/walk-rig.cjs
          node tests/head-fit.cjs
      - name: Assert hands are no longer fused to the thighs
        run: python3 scripts/diagnose-hand-leg-bridges.py assets/reference-rig-fluid.glb --assert-separated
      - name: Test 3D browser gameplay boot
        run: |
          python3 -m http.server 8000 >/tmp/urban-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.cjs
          node tests/model-review.cjs
          node tests/head-review.cjs
          node tests/rig-diagnostics.cjs
          node tests/walk-gait.cjs
      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-3d-mobile-smoke
          path: |
            urban-3d-test.png
            urban-main-menu.png
            urban-brawler-resume.png
            urban-animation-*.png
            urban-body-animated-test.png
            urban-review-*.png
            urban-head-*.png
          if-no-files-found: ignore
