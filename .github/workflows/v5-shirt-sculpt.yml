name: V5 Shirt Sculpt Sandbox (No Deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - art/v5-garment-sculpt-gated
    paths:
      - '.github/workflows/v5-shirt-sculpt.yml'
      - 'tools/blender/v5_shirt_diagnostic.py'
      - 'tools/blender/build_v5_shirt.py'
      - 'tools/blender/sew_v5_shirt.py'
      - 'tests/v5-shirt-source-qa.py'
      - 'tests/v5-shirt-live-rig.cjs'
      - 'scripts/import-sculpted-v5-outfit.js'
      - 'tools/blender/v5_shirt_textures.py'
permissions:
  contents: read
concurrency:
  group: v5-shirt-sculpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-shirt-build:
    name: Model shirt offline and capture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install modeling renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil
      - name: Inspect original rig shape and bone positions
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender -b -t 2 --python tools/blender/v5_shirt_diagnostic.py
      - name: Build new shirt candidate
        if: hashFiles('tools/blender/build_v5_shirt.py') != ''
        run: |
          mkdir -p art/v5/generated
          PYTHONPATH=/usr/lib/python3/dist-packages blender -b -t 2 --python tools/blender/build_v5_shirt.py
      - name: Check continuous garment mesh, 44-joint skinning and six combat poses
        run: python3 tests/v5-shirt-source-qa.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real game glTF engine
        run: npm install --no-save three@0.166.1
      - name: Verify 44-bone shirt compatibility with original playable ninja
        run: node tests/v5-shirt-live-rig.cjs
      - name: Save shirt candidate and render previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-shirt-sculpt-candidate-NOT-APPROVED
          path: |
            art/v5/generated/**
          if-no-files-found: ignore
